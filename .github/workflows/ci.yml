name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: production_ops_ci
          POSTGRES_USER: production_ops_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U production_ops_ci -d production_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-${{ github.run_id }}-${{ github.sha }}-ephemeral-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://production_ops_ci:ci-${{ github.run_id }}-ephemeral@127.0.0.1:5432/production_ops_ci
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint checks
        run: python -m ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Validate deployment security settings
        env:
          DJANGO_SECRET_KEY: ci-${{ github.run_id }}-${{ github.sha }}-ephemeral-key
          DJANGO_ALLOWED_HOSTS: ops-staging.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ops-staging.example.com
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
          DJANGO_TRUST_X_FORWARDED_PROTO: "True"
          REDIS_URL: redis://:ci-${{ github.run_id }}-ephemeral@127.0.0.1:6379/0
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py check_deployment_readiness

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular \
            --file /tmp/production-ops-schema.yml \
            --validate

      - name: Run tests
        run: |
          python -m pytest \
            --cov=operations \
            --cov=analytics \
            --cov=config \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend types
        run: npm run --prefix frontend typecheck

      - name: Run frontend tests
        run: npm run --prefix frontend test

      - name: Build operations frontend
        run: npm run --prefix frontend build

      - name: Prepare Docker environment
        run: cp .env.docker.example .env.docker

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate staging release configuration
        run: |
          docker compose --env-file .env.staging.example --file compose.staging.yml config --quiet
          docker run --rm \
            --env APP_DOMAIN=ops-staging.example.com \
            --env ACME_EMAIL=operations@example.com \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          sh -n scripts/deploy_staging.sh
          sh -n scripts/rollback_staging.sh
          sh -n scripts/backup_postgres.sh
          sh -n scripts/restore_postgres.sh

      - name: Build Docker images
        run: docker compose build web reminders frontend

      - name: Start browser test dependencies
        run: docker compose up --detach --wait db redis

      - name: Prepare browser test database
        run: docker compose run --rm web python manage.py migrate

      - name: Start application stack for browser tests
        run: docker compose up --detach --wait web frontend

      - name: Prepare deterministic browser fixture
        run: |
          e2e_password="E2E-${GITHUB_RUN_ID}-${GITHUB_SHA::12}"
          echo "E2E_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
          docker compose exec -T web python manage.py seed_demo_data \
            --date 2026-09-04 \
            --password "$e2e_password" \
            --full-reset \
            --confirm-full-reset DELETE-ALL-LOCAL-DATA

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run browser acceptance tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run --prefix frontend e2e

      - name: Stop application stack
        if: always()
        run: docker compose down
