name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: production_ops_ci
          POSTGRES_USER: production_ops_ci
          POSTGRES_PASSWORD: production-ops-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U production_ops_ci -d production_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://production_ops_ci:production-ops-ci-password@127.0.0.1:5432/production_ops_ci
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint checks
        run: python -m ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular \
            --file /tmp/production-ops-schema.yml \
            --validate

      - name: Run tests
        run: |
          python -m pytest \
            --cov=operations \
            --cov=analytics \
            --cov=config \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend types
        run: npm run --prefix frontend typecheck

      - name: Run frontend tests
        run: npm run --prefix frontend test

      - name: Build operations frontend
        run: npm run --prefix frontend build

      - name: Prepare Docker environment
        run: cp .env.docker.example .env.docker

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build web reminders frontend
